name: Update README TOC

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'scripts/gen_toc.py'
  workflow_dispatch: {}

jobs:
  generate-toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate TOC
        run: python scripts/gen_toc.py README.md README.en.md

      - name: Commit TOC changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(docs): auto-update README TOC'
          commit_options: '--no-verify'
          skip_fetch: true
