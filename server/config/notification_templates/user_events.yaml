# 用户域事件通知模板

user.password_changed:
  email:
    subject: "【汉江管理系统】密码修改通知"
    content: |
      <h2>密码修改成功</h2>
      <p>您的密码已于 {changed_at} 修改。</p>
      <p>如非本人操作，请立即联系管理员并修改密码。</p>
  station:
    subject: "密码已修改"
    content: "您的密码已于 {changed_at} 修改"

user.created:
  email:
    subject: "【汉江管理系统】欢迎使用"
    content: |
      <h2>欢迎，{username}！</h2>
      <p>您的账号已创建，初始密码为：{temp_password}</p>
      <p>首次登录后请及时修改密码。</p>
  station:
    subject: "账号已创建"
    content: "管理员已为您创建账号"

user.profile_updated:
  station:
    subject: "个人资料已更新"
    content: "您的个人资料已更新"
