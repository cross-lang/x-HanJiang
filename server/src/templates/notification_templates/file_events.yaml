# 文件域事件通知模板（通知发给文件上传者）

file.deleted:
  email:
    subject: "【汉江管理系统】文件删除通知"
    content: |
      <h2>文件已被删除</h2>
      <p>您上传的文件「{filename}」已被操作者 {operator} 删除。</p>
      <p>如非本人预期，请联系管理员核实。</p>
