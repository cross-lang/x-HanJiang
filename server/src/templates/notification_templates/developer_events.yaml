# 开发者域事件通知模板（操作者回执：开发者本人走门户站内信，不经订阅矩阵）

developer.enabled:
  email:
    subject: "【汉江管理系统】开发者启用回执"
    content: |
      <h2>开发者账号已启用</h2>
      <p>您已启用开发者账号「{developer_username}」，该账号可正常登录开放平台门户。</p>
      <p>名下开放应用不会自动恢复启用，需在应用管理页单独控制。</p>
  station:
    subject: "开发者账号已启用"
    content: "您已启用开发者账号「{developer_username}」，名下应用需单独恢复启用"
  dingtalk:
    subject: "开发者账号已启用"
    content: "您已启用开发者账号「{developer_username}」，名下开放应用不会自动恢复，需在应用管理页单独控制"
  feishu:
    subject: "开发者账号已启用"
    content: "您已启用开发者账号「{developer_username}」，名下开放应用不会自动恢复，需在应用管理页单独控制"

