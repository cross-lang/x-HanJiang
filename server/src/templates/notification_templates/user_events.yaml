# 用户域事件通知模板

user.password_changed:
  email:
    subject: "【汉江管理系统】密码修改通知"
    content: |
      <h2>密码修改成功</h2>
      <p>您的密码已于 {changed_at} 修改。</p>
      <p>如非本人操作，请立即联系管理员并修改密码。</p>
  station:
    subject: "密码已修改"
    content: "您的密码已于 {changed_at} 修改"
  dingtalk:
    subject: "密码已修改"
    content: "您的密码已于 {changed_at} 修改，如非本人操作请立即联系管理员"

  feishu:
    subject: "密码已修改"
    content: "您的密码已于 {changed_at} 修改，如非本人操作请立即联系管理员"

user.created:
  email:
    subject: "【汉江管理系统】账号创建通知"
    content: |
      <h2>账号已创建</h2>
      <p>用户 {username} 的账号已创建。</p>
      <p>若是您的账号，请使用管理员提供的初始密码登录，并尽快修改密码。</p>
  station:
    subject: "账号已创建"
    content: "用户 {username} 的账号已创建，请使用初始密码登录并尽快修改密码"
  dingtalk:
    subject: "账号已创建"
    content: "用户 {username} 的账号已创建"

  feishu:
    subject: "账号已创建"
    content: "用户 {username} 的账号已创建"

user.profile_updated:
  email:
    subject: "【汉江管理系统】资料变更通知"
    content: |
      <h2>个人资料已更新</h2>
      <p>您的个人资料已更新，如非本人操作请联系管理员核实。</p>
  station:
    subject: "个人资料已更新"
    content: "您的个人资料已更新"
  dingtalk:
    subject: "个人资料已更新"
    content: "您的个人资料已更新，如非本人操作请联系管理员核实"

  feishu:
    subject: "个人资料已更新"
    content: "您的个人资料已更新，如非本人操作请联系管理员核实"

user.enabled:
  email:
    subject: "【汉江管理系统】账号启用通知"
    content: |
      <h2>账号已启用</h2>
      <p>您的账号已被管理员启用（原因：{reason}），现在可以正常登录使用。</p>
  station:
    subject: "账号已启用"
    content: "您的账号已被管理员启用（原因：{reason}）"
  dingtalk:
    subject: "账号已启用"
    content: "您的账号已被管理员启用（原因：{reason}）"

  feishu:
    subject: "账号已启用"
    content: "您的账号已被管理员启用（原因：{reason}）"

user.disabled:
  email:
    subject: "【汉江管理系统】账号禁用通知"
    content: |
      <h2>账号已被禁用</h2>
      <p>您的账号已被管理员禁用（原因：{reason}），将无法登录系统。</p>
      <p>如非本人预期，请联系管理员核实。</p>
  station:
    subject: "账号已被禁用"
    content: "您的账号已被管理员禁用（原因：{reason}），将无法登录系统"
  dingtalk:
    subject: "账号已被禁用"
    content: "您的账号已被管理员禁用（原因：{reason}），如非本人预期请联系管理员核实"

  feishu:
    subject: "账号已被禁用"
    content: "您的账号已被管理员禁用（原因：{reason}），如非本人预期请联系管理员核实"

user.deleted:
  email:
    subject: "【汉江管理系统】账号删除通知"
    content: |
      <h2>账号已删除</h2>
      <p>您的账号已被管理员删除并注销，相关数据将按保留策略处理。</p>
      <p>如非本人预期，请联系管理员核实。</p>
  station:
    subject: "账号已删除"
    content: "您的账号已被管理员删除并注销，如非本人预期请联系管理员核实"
  dingtalk:
    subject: "账号已删除"
    content: "您的账号已被管理员删除并注销，如非本人预期请联系管理员核实"

  feishu:
    subject: "账号已删除"
    content: "您的账号已被管理员删除并注销，如非本人预期请联系管理员核实"

user.login_failed:
  email:
    subject: "【汉江管理系统】登录异常告警"
    content: |
      <h2>连续登录失败告警</h2>
      <p>账号 {username} 在近期 30 分钟内连续登录失败 {fail_count} 次。</p>
      <p>最近一次尝试时间：{attempt_time}，来源 IP：{ip_address}。</p>
      <p>如非本人操作，请立即修改密码并联系管理员。</p>
  station:
    subject: "登录异常告警"
    content: "账号 {username} 近 30 分钟内登录失败 {fail_count} 次（最近 IP：{ip_address}），如非本人操作请立即修改密码"
  dingtalk:
    subject: "登录异常告警"
    content: "账号 {username} 近 30 分钟内登录失败 {fail_count} 次（最近 IP：{ip_address}），如非本人操作请立即修改密码"

  feishu:
    subject: "登录异常告警"
    content: "账号 {username} 近 30 分钟内登录失败 {fail_count} 次（最近 IP：{ip_address}），如非本人操作请立即修改密码"

