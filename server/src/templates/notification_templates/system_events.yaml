# 系统域事件通知模板（system.notice 走 pre_rendered 直传内容，无需模板；验证码模板在 security_events.yaml）

system.alert:
  email:
    subject: "【汉江告警】{alert_title}"
    content: |
      <h2>{alert_title}</h2>
      <p>{alert_message}</p>
      <p>请相关人员及时关注处理。</p>
  station:
    subject: "{alert_title}"
    content: "{alert_message}"
  dingtalk:
    subject: "{alert_title}"
    content: "{alert_message}"
  feishu:
    subject: "{alert_title}"
    content: "{alert_message}"
