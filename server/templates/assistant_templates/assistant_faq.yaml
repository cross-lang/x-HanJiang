# AI 助手 FAQ 操作手册（内容资产）
#
# 本文件是运行时加载的数据文件，不属于代码常量：
#   - 加载器：src/assistant/faq.py::load_assistant_faq()
#   - 使用方：src/assistant/knowledge.py::SystemPromptBuilder.match_faq()
#
# 维护说明：
#   - faq 列表顺序 = 匹配优先级，高频/具体的问题放前面
#   - id 必须唯一；keywords 为命中关键词（对用户问题做子串匹配，命中任一即召回）
#   - entry_path 必须是入口目录（ASSISTANT_ENTRY_CATALOG）中的路由；无需跳转则留空
#   - 内容来自系统各功能页面的真实操作流程（web/admin/src/views/*），禁止编造步骤
#   - 新增/调整条目后，同步更新黄金问答集测试（verify_assistant.py）回归

faq:
  - id: add_user
    keywords:
      - 怎么添加用户
      - 怎么新增用户
      - 创建用户
      - 新增用户
      - 添加用户
      - 加个用户
      - 新增一个用户
    question: 怎么添加用户？
    answer: |
      1. 进入「用户管理」页面；
      2. 点击右上角「新建用户」按钮；
      3. 填写用户名、姓名、邮箱、手机号、生日、性别、角色与初始密码，状态默认「启用」；
      4. 点击「确定」保存。保存后即可在列表看到该用户，并可在其所在行编辑或分配角色。
    entry_path: /users

  - id: edit_user
    keywords:
      - 怎么编辑用户
      - 修改用户信息
      - 编辑用户
      - 改用户资料
      - 更新用户
    question: 怎么修改用户信息？
    answer: |
      1. 进入「用户管理」页面；
      2. 在目标用户所在行点击「编辑」；
      3. 修改姓名、邮箱、手机号、生日、性别、角色、状态等信息；
      4. 点击「确定」保存。用户名创建后不可修改。
    entry_path: /users

  - id: toggle_user_status
    keywords:
      - 怎么停用用户
      - 禁用用户
      - 启用用户
      - 冻结账号
      - 停用账号
      - 账号停用
      - 禁用
      - 停用
    question: 怎么启用或禁用用户？
    answer: |
      进入「用户管理」页面，在目标用户所在行点击「启用 / 禁用」按钮即可切换账号状态；
      禁用后该用户将无法登录系统。
    entry_path: /users

  - id: reset_user_password
    keywords:
      - 怎么重置密码
      - 重置用户密码
      - 忘记密码
      - 重置他人密码
      - 改别人密码
      - 重置一下密码
    question: 怎么重置用户密码？
    answer: |
      1. 进入「用户管理」页面；
      2. 在目标用户所在行点击「重置密码」（超级管理员账号与本人账号不可操作）；
      3. 在弹窗中输入新密码并确认；
      4. 保存后通知该用户使用新密码登录。
    entry_path: /users

  - id: list_users
    keywords:
      - 用户列表
      - 有哪些用户
      - 查看用户
      - 用户在哪里
      - 用户都在哪
    question: 在哪里查看用户列表？
    answer: |
      点击左侧菜单「用户管理」即可查看全部用户，列表展示用户名、姓名、邮箱、手机号、角色、状态与创建时间等信息。
    entry_path: /users

  - id: create_role
    keywords:
      - 怎么创建角色
      - 新建角色
      - 添加角色
      - 新增角色
      - 创建角色
      - 角色管理怎么用
      - 角色管理
    question: 怎么创建角色？
    answer: |
      角色管理用于创建角色并为其分配权限，创建角色步骤如下：
      1. 进入「角色管理」页面；
      2. 点击「新建角色」按钮；
      3. 填写角色名称、角色编码与描述；
      4. 勾选该角色拥有的权限；
      5. 点击「确定」保存。创建后即可在「用户管理」中给用户分配该角色。
    entry_path: /roles

  - id: bind_role_permissions
    keywords:
      - 怎么给角色配权限
      - 角色权限
      - 编辑角色
      - 修改角色权限
      - 分配权限
      - 角色绑定权限
    question: 怎么给角色分配权限？
    answer: |
      1. 进入「角色管理」页面；
      2. 在目标角色所在行点击「编辑」；
      3. 在权限列表中勾选或取消该角色的权限；
      4. 点击「确定」保存。权限变更对该角色下所有用户即时生效。
    entry_path: /roles

  - id: delete_role
    keywords:
      - 怎么删除角色
      - 删除角色
      - 移除角色
    question: 怎么删除角色？
    answer: |
      进入「角色管理」页面，在目标角色所在行点击「删除」并确认即可；
      删除前请确认该角色未被任何用户占用，否则会删除失败。
    entry_path: /roles

  - id: view_permissions
    keywords:
      - 权限列表
      - 有哪些权限
      - 查看权限
      - 权限管理
      - 权限码
    question: 在哪里查看系统权限？
    answer: |
      点击左侧菜单「权限管理」即可查看全部权限，支持按权限编码、名称或模块搜索，列表展示编码、名称、模块、操作与描述。
    entry_path: /permissions

  - id: view_audit_log
    keywords:
      - 审计日志
      - 操作日志
      - 操作审计
      - 谁操作过
      - 查审计
      - 审计记录
    question: 怎么查看审计日志（操作记录）？
    answer: |
      1. 点击左侧菜单「审计日志」进入操作审计页面；
      2. 列表展示操作人（用户名（姓名））、实体类型、操作、备注、IP 与时间；
      3. 支持按操作人/IP/备注关键字搜索，也可点击「导出CSV」下载；
      4. 点击行内「详情」可查看变更前后的完整数据。
    entry_path: /logs/audit

  - id: view_login_log
    keywords:
      - 登录日志
      - 谁登录过
      - 登录记录
      - 登录历史
      - 查看登录
      - 登录情况
    question: 怎么查看登录日志？
    answer: |
      1. 点击左侧菜单「登录日志」进入登录记录页面；
      2. 列表展示用户名、姓名、登录方式、状态（成功/失败）、IP 与时间；
      3. 支持按 IP/状态/登录方式关键字搜索，也可点击「导出CSV」下载；
      4. 点击行内「详情」可查看单条登录记录的完整信息。
    entry_path: /logs/login

  - id: manage_open_apps
    keywords:
      - 怎么创建应用
      - 开放平台
      - 接入应用
      - 应用密钥
      - API 应用
      - 新建应用
      - 重置密钥
      - 应用列表
    question: 怎么管理开放平台应用？
    answer: |
      1. 点击左侧菜单「开放平台 → 应用管理」查看应用列表；
      2. 点击「新建应用」填写名称并勾选授权权限范围（scope），管理员分配的应用创建即生效；
      3. 开发者自助提交的应用需经管理端审批通过后才可调用；
      4. 应用所在行支持「编辑」「启用/禁用」；「更多」下拉可重置密钥或删除（管理员分配的应用）；
      5. 开发者名下应用由开发者在开放平台门户自助管理，管理端不代操作。
    entry_path: /apps

  - id: review_app_approval
    keywords:
      - 应用审批
      - 审批应用
      - 待审批
      - 通过申请
      - 驳回申请
      - 审批申请
      - 申请审批
    question: 怎么处理开放应用申请审批？
    answer: |
      1. 点击左侧菜单「开放平台 → 应用审批」，筛选「待审批」查看待处理申请；
      2. 列表展示申请码、申请类型、应用名称、申请人、申请权限范围与提交时间；
      3. 点击「详情」只读查看申请信息；点击「通过」直接放行，应用即可调用；
      4. 点击「驳回」必须填写驳回原因，开发者将据此调整后重新提交；
      5. 审批结果会通过站内信通知开发者，审批通过的应用才可正常调用开放接口。
    entry_path: /app-approvals

  - id: manage_developers
    keywords:
      - 开发者管理
      - 开发者列表
      - 开放平台开发者
      - 查看开发者
      - 开发者
    question: 怎么查看开放平台开发者？
    answer: |
      1. 点击左侧菜单「开放平台 → 开发者管理」查看开发者列表；
      2. 列表展示用户名、姓名、邮箱、手机号、认证状态、账号状态与旗下应用数量；
      3. 可按用户名/邮箱/姓名搜索，或按账号状态筛选；
      4. 点击行内「查看应用」可查看该开发者名下的全部应用。
    entry_path: /open-developers

  - id: upload_files
    keywords:
      - 怎么上传文件
      - 上传文件
      - 传文件
      - 文件管理
      - 上传附件
    question: 怎么上传文件？
    answer: |
      1. 进入「文件管理」页面；
      2. 点击「上传文件」按钮选择本地文件；
      3. 上传成功后文件出现在列表中，可对文件执行「下载」或「删除」操作。
    entry_path: /files

  - id: update_profile
    keywords:
      - 怎么改头像
      - 修改个人资料
      - 改个人信息
      - 个人中心
      - 我的资料
      - 修改我的密码
      - 怎么改我的密码
    question: 怎么修改个人资料？
    answer: |
      1. 点击右上角头像进入「个人中心」；
      2. 在「基本信息」标签修改姓名、生日、性别等，点击「保存修改」；
      3. 手机号、邮箱、密码在「安全设置」标签修改，需验证码二次认证：
         点击「发送验证码」→ 系统向当前账号邮箱发送 6 位验证码（5 分钟内有效）
         → 输入验证码和新手机号/邮箱/密码后提交。
    entry_path: /profile

  - id: system_intro
    keywords:
      - 你能干什么
      - 能做什么
      - 怎么用这个系统
      - 系统怎么用
      - 你有什么功能
      - 这个系统能做什么
    question: 这个系统能做什么？
    answer: |
      汉江管理系统提供：用户管理（增删改查与密码重置）、角色与权限管理、审计日志与登录日志（可导出）、开放平台（应用管理、应用审批、Scope 查看、开发者管理）、系统通知与公告发布、站内信、文件管理、仪表盘监控、个人中心等能力。
      你可以直接问我具体操作，或告诉我目标页面，我来帮你跳转。
    entry_path: /home

  - id: dashboard_overview
    keywords:
      - 首页有什么
      - 看板
      - 概览
      - 系统指标
      - 首页
    question: 首页展示了什么？
    answer: |
      「首页」展示系统概览与核心指标看板，并列出常用功能入口卡片（用户管理、角色管理等），是进入各功能的起点。
    entry_path: /home

  - id: view_dashboard
    keywords:
      - 仪表盘
      - 系统监控
      - 服务器状态
      - CPU
      - 内存
      - 磁盘
      - 系统运行
      - 待审批
    question: 仪表盘展示了什么？
    answer: |
      「仪表盘」是系统运行看板，包含：
      1. 关键业务指标卡片（用户数、应用数等）；
      2. 待审批申请列表（开放平台应用申请）；
      3. 服务器 CPU / 内存 / 磁盘使用率等运行指标；
      4. 最近登录与最近操作动态（用户、IP、状态、时间）。
    entry_path: /dashboard

  - id: publish_notification
    keywords:
      - 发布通知
      - 发通知
      - 系统通知
      - 通知怎么发
      - 维护公告
      - 系统维护
      - 撤回通知
      - 重新发布通知
    question: 怎么发布系统通知？
    answer: |
      1. 进入「系统通知」页面，点击「发布通知」；
      2. 选择通知类型：普通通知（填标题与正文）或系统维护（填维护时间、预计时长与原因）；
      3. 选择推送范围：全体活跃用户 / 指定角色 / 指定用户；
      4. 可选勾选强推渠道：邮件 / 钉钉 / 飞书（站内信默认必推）；
      5. 点击「发布」，目标用户将收到站内信（未读红点）。
      已发布的通知支持「撤回」（用户不再可见）和「重新发布」（按首次受众快照重新推送）。
    entry_path: /system-notification

  - id: manage_announcements
    keywords:
      - 公告
      - 新建公告
      - 发公告
      - 公告管理
      - 下架公告
      - 首页公告
    question: 怎么发布公告？
    answer: |
      1. 进入「公告管理」页面，点击「新建公告」填写标题、内容与有效期；
      2. 保存后公告为草稿状态，在列表中点击「发布」后展示在首页；
      3. 已发布公告支持「编辑」和「下架」，下架后首页不再展示；
      4. 列表可按状态筛选（已发布 / 已下架），过期公告自动标记「已过期」。
    entry_path: /announcements

  - id: view_app_scopes
    keywords:
      - scope
      - Scope
      - 授权范围
      - 权限范围
      - 接口授权
    question: 开放平台的 scope 在哪里查看？
    answer: |
      点击左侧菜单「开放平台 → Scope」即可查看全部 scope 清单，
      列表展示 Scope 编码、名称、模块、操作与说明，支持按编码/名称/模块搜索。
      scope 是开放应用调用接口的授权粒度（分 read / write 两级），可在应用管理中为应用勾选授权。
    entry_path: /app-scopes

  - id: station_messages
    keywords:
      - 站内信
      - 站内消息
      - 我的消息
      - 未读消息
      - 消息列表
      - 消息通知
    question: 怎么查看我的站内信？
    answer: |
      1. 进入「站内信」页面，列表展示系统通知、告警、开放平台等来源发来的消息；
      2. 支持按来源 / 接收日期 / 关键词过滤；
      3. 点击消息可查看详情，未读消息点击后自动标记已读；
      4. 右上角「导出CSV」可将消息记录下载留档。
    entry_path: /station-messages
