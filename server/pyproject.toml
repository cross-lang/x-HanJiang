[project]
name = "x-HanJiang"
version = "0.1.0"
description = "一个基于 FastAPI 框架深度封装的生产级 Python Web 项目"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "John Young", email = "john.young@foxmail.com" },
]
keywords = ["fastapi", "template", "production", "restful-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.8.0",
    "boto3>=1.35.0",
    "openai>=3.19.2",
    "psutil>=6.0.0",
    "pycryptodome>=3.20.0",
    "netaddr>=1.3.0",
    "py7zr>=0.22.0",
    "xmltodict>=0.13.0",
    "scapy>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
x-HanJiang = "src.main:main"

[project.optional-dependencies]
s3 = ["boto3>=1.35.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

# 按目录豁免的规则（均为有意的工程决策）：
#   B008: FastAPI 依赖注入（Depends/Query/File）作为参数默认值是框架惯用法
#   A002: 数据层 CRUD 的 `id` 参数是 SQLAlchemy 仓储通用命名约定
#   N818: 项目异常层级统一使用 *Exception 后缀命名（见 core/exceptions.py 文档）
[tool.ruff.lint.per-file-ignores]
"src/api/**" = ["B008"]
"src/repositories/**" = ["A002"]
"src/services/**" = ["A002"]
"src/utils/cmd.py" = ["A002"]
"src/core/exceptions.py" = ["N818"]
"tests/**" = ["A002", "B008"]
"examples/**" = ["A002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

# 无类型存根的第三方库：跳过缺失/未类型化导入检查，仅对这些模块生效
[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore.*",
    "Crypto.*",
    "scapy.*",
    "py7zr",
    "pypinyin",
    "xmltodict",
    "netaddr",
    "psutil",
    "yaml",
    "slowapi.*",
]
ignore_missing_imports = true
