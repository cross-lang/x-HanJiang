# 寒江（HanJiang）默认配置文件
# 优先级：环境变量 > 环境特定配置(config.{env}.yaml) > 本文件 > 代码默认值

server:
  host: "0.0.0.0"
  port: 8000
  debug: true
  workers: 1

logging:
  level: "INFO"
  file_path: "logs/x-HanJiang-{time:YYYYMMDDHH}.log"
  rotation: "1 hour"
  retention: "7 days"

cors:
  origins:
    - "*"

rate_limit:
  per_minute: 60

auth:
  secret_key: "dev-only-do-not-use-in-prod-aaaaaaaaaaaaaaaaaaaaaa"
  algorithm: "HS256"
  access_token_expire_minutes: 10080
  refresh_token_expire_days: 30

database:
  url: "mysql://root:CHANGE_ME@localhost:3306/hanjiang"
  pool_size: 5

redis:
  url: "redis://:CHANGE_ME@localhost:6379/0"