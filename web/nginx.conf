# 汉江（HanJiang）生产环境 Nginx 站点配置：单域单机统一入口
#
# 同域路由规划（IP 直访，无 HTTPS）：
#   /             → 302 跳转管理系统
#   /admin/       → 管理系统前端 SPA（web/admin 构建产物，vite base=/admin/）
#   /open-portal/ → 开放平台门户前端 SPA（web/open_portal 构建产物，vite base=/open-portal/）
#   /api/        → 后端 FastAPI（app:8000），注入 X-Real-IP（后端 get_client_ip 只认此头）
#   /docs /redoc /openapi.json → 后端 Swagger 文档（演示便利，生产收紧时可删除）

server {
    listen 80;
    server_name _;

    # 静态站点根：admin 产物在 admin/ 子目录，open_portal 产物在 open-portal/ 子目录
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（头像等 base64 JSON 上传走 API，放宽请求体限制）
    client_max_body_size 20m;

    # Gzip 压缩（Element Plus 主包约 800KB，压缩后显著提升 IP 直访加载速度）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # 优先发送前端构建时预压缩的 .gz 文件（vite 打包产物），命中时无运行时压缩开销
    gzip_static on;

    # ── 后端 API 反向代理 ─────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        # SSE（AI 助手流式响应）：关闭缓冲，事件即时透传前端
        proxy_buffering off;
        proxy_cache off;
        # 清空 Connection 头以支持长连接 / SSE
        proxy_set_header Connection "";
        # AI 单轮对话整体超时 180s，代理读超时需覆盖
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        # 后端 get_client_ip 只认 X-Real-IP，此处写入真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 文档反代（演示便利，可按需删除） ──────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 管理系统 SPA（/admin 前缀） ───────────────────────────
    location = /admin {
        return 308 /admin/;
    }
    location /admin/ {
        # history 路由回退：/users、/announcements 等刷新直达入口
        try_files $uri $uri/ /admin/index.html;
    }

    # ── 开放平台门户 SPA（/open-portal 前缀） ─────────────────
    location = /open-portal {
        return 308 /open-portal/;
    }
    location /open-portal/ {
        # history 路由回退：静态资源不存在时统一落到门户入口
        try_files $uri $uri/ /open-portal/index.html;
    }

    # ── 根路径兜底：统一跳转管理系统 ─────────────────────────
    location = / {
        return 302 /admin/;
    }

    # ── 静态资源长缓存（Vite 产物带内容指纹，缓存安全） ───────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
