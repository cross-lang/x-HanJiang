# 汉江（HanJiang）Docker Compose 配置
# 使用方法：docker-compose up --build
#
# 架构：nginx（前端托管 + 统一入口 :80）→ app（后端 API，仅容器网络内）→ mysql / redis
# 同域路由：/ 管理系统前端 | /portal/ 开放平台门户 | /api/ 后端反代（详见 web/nginx.conf）
#
# 注意：生产环境部署时：
#   1. AUTH_SECRET_KEY 必须通过环境变量注入，禁用默认占位符
#   2. 数据库密码同样需要外部注入
#   3. CORS origins 应限制为可信来源
#   4. 创建 .env 文件或通过 CI/CD 注入所有 ? required 变量

services:
  app:
    build:
      # 后端构建上下文为 server/ 目录（复用 server/Dockerfile，其 COPY 路径均相对 server/）
      context: ./server
      dockerfile: Dockerfile
    container_name: x-HanJiang
    # 对外仅暴露 nginx :80（前端 + API 统一入口）；app 端口仅容器网络内可见
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      # 生产配置校验（config.py validate）：debug 必须为 false、CORS 禁止 '*'
      # 未显式配置时默认关闭调试并放开开发端口白名单（生产域名在 .env 中通过 CORS_ORIGINS 覆盖）
      - SERVER_DEBUG=${SERVER_DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
      # 必填项：生产环境必须覆盖默认值
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required (>=32 chars)}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hanjiang}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=${REDIS_DB:-0}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      # AI 助手大模型密钥（敏感信息仅经环境变量注入，不落镜像/代码）
      - AI_LLM_API_KEY=${AI_LLM_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, socket; socket.setdefaulttimeout(3); urllib.request.urlopen('http://localhost:8000/api/admin/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: x-HanJiang-nginx
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: x-HanJiang-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hanjiang}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --port=${MYSQL_PORT:-3306}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"   # 宿主机 3307 → 容器 3306；本机另有独立部署的 mysql 占用标准 3306，故错开端口
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: x-HanJiang-redis
    environment:
      - REDIS_USER=${REDIS_USER:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
    command: ["redis-server", "--appendonly", "yes", "--port", "${REDIS_PORT:-6379}", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"   # 宿主机 6380 → 容器 6379；本机另有独立部署的 redis 占用标准 6379，故错开端口
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p $${REDIS_PORT} --user $${REDIS_USER} -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:

networks:
  backend:
    driver: bridge
